# Oriserve Whisper Hindi2Hinglish Swift Model Configuration
# Smallest model (72.6M params) - Based on whisper-base
# Outputs Hinglish (romanized) text

model:
  name: "Oriserve Hindi2Hinglish Swift"
  model_id: "Oriserve/Whisper-Hindi2Hinglish-Swift"
  type: "whisper"
  
  # Model-specific parameters
  # Note: This model outputs in romanized Hinglish, not Devanagari
  language: "en"  # Model uses English tokens for Hinglish output
  
  # Generation parameters
  generation:
    max_new_tokens: 440
    num_beams: 5
    do_sample: false

# Evaluation settings
evaluation:
  verbose: true
